# On every push and pull request: run the test suite against a PostgreSQL
# service container, and check that the Docker image still builds. A red X on
# a commit means it broke something before anyone deploys it.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_DB: mahokshahvata
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway database inside the CI runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Docker image
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
