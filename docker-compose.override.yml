# Laptop only (docker compose loads this automatically; the VM never has it).
# Builds the image from this checkout and runs a local PostgreSQL, so
# `docker compose up --build` needs no cloud access and never touches real data.
# Keys for local runs (e.g. ANTHROPIC_API_KEY) come from your gitignored .env.

services:
  app:
    build: .
    image: mahokshahvata/app:local   # local builds never overwrite a registry tag
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DATA_DIR: /data          # local stand-in for the storage bucket
      USE_DEMO_AUTH: "true"    # "Continue with demo account"; never set on the VM
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: mahokshahvata
      POSTGRES_HOST_AUTH_METHOD: trust   # reachable only inside this compose network
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "mahokshahvata"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  app-data:
  pg-data:
