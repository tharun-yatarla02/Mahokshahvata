<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahokshahvata | Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .auth-wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 32px 16px; }
      .auth-card { width: 100%; max-width: 420px; }
      .auth-card form { display: grid; gap: 6px; margin-top: 12px; }
      .auth-card input { width: 100%; }
      .auth-card button[type="submit"] { width: 100%; margin-top: 12px; }
      .auth-switch { margin-top: 16px; color: var(--muted); font-size: 0.9375rem; }
      .auth-switch button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
      .status-actions { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; }
      .status-actions button { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
      .auth-divider { margin: 20px 0 12px; text-align: center; color: var(--muted); font-size: 0.8125rem; }
      .auth-demo { width: 100%; }
      .navbar .nav-actions { margin-left: auto; }  /* no nav links on this page to push it right */
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-inner">
        <div class="brand">
          <div class="brand-mark">M</div>
          <span>Mahokshahvata</span>
        </div>
        <div class="nav-actions">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch color mode">Light mode</button>
        </div>
      </div>
    </nav>

    <main class="auth-wrap">
      <div class="card premium-card auth-card">
        <span class="eyebrow">Paper trading, no real money</span>
        <h2 id="authTitle">Sign in</h2>
        <p id="authSubtitle">Welcome back. Your portfolios are waiting.</p>

        <form id="authForm" novalidate>
          <div id="nameField" hidden>
            <label class="label" for="authName">Name</label>
            <input id="authName" type="text" autocomplete="name" maxlength="100" />
          </div>
          <label class="label" for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email" maxlength="254" required />
          <label class="label" for="authPassword">Password</label>
          <input id="authPassword" type="password" autocomplete="current-password" minlength="8" maxlength="128" required />
          <button id="authSubmit" type="submit">Sign in</button>
        </form>
        <div class="status" id="authStatus" role="alert" style="margin-top: 14px; display: none;"></div>

        <p class="auth-switch">
          <span id="switchPrompt">New here?</span>
          <button id="switchMode" type="button">Create an account</button>
        </p>

        <div class="auth-divider">or</div>
        <button id="googleButton" class="secondary auth-demo" type="button">Continue with Google</button>
        <button id="demoButton" class="secondary auth-demo" type="button" style="margin-top: 8px;">Continue with demo account</button>
      </div>
    </main>

    <script src="/api.js"></script>
    <script>
      const next = safeNextPath(new URLSearchParams(window.location.search).get('next'));
      if (getAuthToken()) window.location.replace(next);  // already signed in

      let mode = 'login';
      const form = document.getElementById('authForm');
      const statusEl = document.getElementById('authStatus');
      const submit = document.getElementById('authSubmit');

      function setMode(nextMode) {
        mode = nextMode;
        const registering = mode === 'register';
        document.getElementById('authTitle').textContent = registering ? 'Create your account' : 'Sign in';
        document.getElementById('authSubtitle').textContent = registering
          ? 'Start with a simulated portfolio. Your data is saved to your account.'
          : 'Welcome back. Your portfolios are waiting.';
        document.getElementById('nameField').hidden = !registering;
        document.getElementById('authPassword').autocomplete = registering ? 'new-password' : 'current-password';
        submit.textContent = registering ? 'Create account' : 'Sign in';
        document.getElementById('switchPrompt').textContent = registering ? 'Already have an account?' : 'New here?';
        document.getElementById('switchMode').textContent = registering ? 'Sign in' : 'Create an account';
        showStatus('');
      }

      // actions: [{label, onClick}] shown as links under the message.
      function showStatus(message, kind = 'error', actions = []) {
        statusEl.textContent = message;
        if (actions.length) {
          const row = document.createElement('div');
          row.className = 'status-actions';
          for (const { label, onClick } of actions) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            button.addEventListener('click', onClick);
            row.appendChild(button);
          }
          statusEl.appendChild(row);
        }
        statusEl.className = message ? `status ${kind}` : 'status';
        statusEl.style.display = message ? '' : 'none';
      }

      // Same rule as EMAIL_PATTERN in api/main.py, so the form catches typos
      // before the server's less friendly 422.
      const EMAIL_PATTERN = /^[^@\s]{1,64}@[^@\s]+\.[^@\s]+$/;

      function focusField(id, select = false) {
        const input = document.getElementById(id);
        input.focus();
        if (select) input.select();
      }

      // Registering with an email that already has an account (409).
      // The server says when that account uses Google instead of a password.
      function showEmailTaken(email, serverMessage) {
        if (/Google/.test(serverMessage)) {
          return showStatus(`An account with ${email} already exists and signs in with Google. Use Continue with Google below.`);
        }
        showStatus(`An account with ${email} already exists.`, 'error', [
          { label: 'Sign in instead', onClick: () => {
            setMode('login');  // keeps the typed email
            document.getElementById('authPassword').value = '';
            focusField('authPassword');
          } },
          { label: 'Use a different email', onClick: () => { showStatus(''); focusField('authEmail', true); } },
        ]);
      }

      // Wrong password or unknown email (401). The server deliberately doesn't
      // say which, so offer both ways forward.
      function showLoginFailed() {
        showStatus('That email and password don’t match an account.', 'error', [
          { label: 'Create an account', onClick: () => { setMode('register'); focusField('authName'); } },
          { label: 'Try again', onClick: () => { showStatus(''); focusField('authPassword', true); } },
        ]);
      }

      document.getElementById('switchMode').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const name = document.getElementById('authName').value.trim();
        if (mode === 'register' && !name) return showStatus('Enter your name.');
        if (!email || !password) return showStatus('Enter your email and password.');
        if (mode === 'register' && !EMAIL_PATTERN.test(email)) {
          focusField('authEmail', true);
          return showStatus('Enter a valid email address, like name@example.com.');
        }
        if (mode === 'register' && password.length < 8) return showStatus('Use a password of at least 8 characters.');

        submit.disabled = true;
        submit.textContent = mode === 'register' ? 'Creating account…' : 'Signing in…';
        try {
          const body = mode === 'register' ? { name, email, password } : { email, password };
          const session = await apiFetch(`/auth/${mode}`, { method: 'POST', body: JSON.stringify(body) });
          setAuthToken(session.token);
          window.location.replace(next);
        } catch (error) {
          if (mode === 'register' && error.status === 409) showEmailTaken(email, error.message);
          else if (mode === 'login' && error.status === 401) showLoginFailed();
          else showStatus(error.message);
          submit.disabled = false;
          submit.textContent = mode === 'register' ? 'Create account' : 'Sign in';
        }
      });

      // Google: Firebase shows the popup and hands back an ID token, which the
      // server swaps for one of our sessions (POST /auth/google). The Firebase
      // sign-in itself isn't kept; our session is the only one. Public web config
      // (project mahokshahvata-ae5f9); Firestore rules deny all browser access.
      const FIREBASE_CONFIG = {
        apiKey: 'AIzaSyC1MRo0OW_slh8cNwXtNjubi4WRB8-dw_A',
        authDomain: 'mahokshahvata-ae5f9.firebaseapp.com',
        projectId: 'mahokshahvata-ae5f9',
        appId: '1:148447370236:web:8b547e3b0161a69994b079',
      };
      const googleButton = document.getElementById('googleButton');
      googleButton.addEventListener('click', async () => {
        googleButton.disabled = true;
        showStatus('');
        try {
          const sdk = 'https://www.gstatic.com/firebasejs/12.19.0';
          const { initializeApp } = await import(`${sdk}/firebase-app.js`);
          const { getAuth, GoogleAuthProvider, signInWithPopup, signOut: firebaseSignOut } = await import(`${sdk}/firebase-auth.js`);
          const auth = getAuth(initializeApp(FIREBASE_CONFIG));
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          const result = await signInWithPopup(auth, provider);
          const session = await apiFetch('/auth/google', {
            method: 'POST', body: JSON.stringify({ id_token: await result.user.getIdToken() }),
          });
          await firebaseSignOut(auth);
          setAuthToken(session.token);
          window.location.replace(next);
        } catch (error) {
          const closed = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error.code);
          if (!closed) showStatus(error.code === 'auth/popup-blocked' ? 'Allow pop-ups for this site, then try again.' : error.message);
          googleButton.disabled = false;
        }
      });

      document.getElementById('demoButton').addEventListener('click', async () => {
        setAuthToken('demo-token');
        try {
          await apiFetch('/auth/me');
          window.location.replace(next);
        } catch {
          setAuthToken(null);
          showStatus('The demo account is turned off on this server (USE_DEMO_AUTH).');
        }
      });

      function setTheme(nextTheme) {
        document.body.setAttribute('data-theme', nextTheme);
        try { localStorage.setItem('theme', nextTheme); } catch {}
        document.getElementById('themeToggle').textContent = nextTheme === 'dark' ? 'Light mode' : 'Dark mode';
      }
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('theme'); } catch {}
      setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
      document.getElementById('themeToggle').addEventListener('click', () => {
        setTheme(document.body.dataset.theme === 'light' ? 'dark' : 'light');
      });
    </script>
  </body>
</html>
