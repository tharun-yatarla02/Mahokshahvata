# Shared by laptops and the VM. Laptops also pick up docker-compose.override.yml
# automatically (local build, local Postgres, a .env for keys); the VM adds
# docker-compose.vm.yml (Cloud SQL, the storage bucket, Secret Manager).
#
#   laptop:  docker compose up --build              -> http://localhost
#   VM:      docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d
#
# The app keeps no state in its container or on the VM's disk: the database is
# Cloud SQL, files are in Cloud Storage, and keys come from Secret Manager.
# Network: both services share the default compose network; only Caddy
# publishes a port. The app is reachable inside the network as app:8000.

name: mahokshahvata

services:
  app:
    image: ${IMAGE:-us-central1-docker.pkg.dev/project-262a2026-879b-4b49-88e/mahokshahvata/app}:${TAG:-v1}
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # cap logs on the VM's 20 GB disk

  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from :80 --to app:8000
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy   # no 502s while the app is still starting
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
