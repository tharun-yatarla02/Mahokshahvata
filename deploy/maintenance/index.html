<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Under maintenance · Mahokshahvata</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { max-width: 440px; background: var(--card); border-radius: 20px; padding: 32px; text-align: center; }
    .mark { width: 40px; height: 40px; border-radius: 10px; margin: 0 auto 16px; display: grid; place-items: center;
            background: var(--text); color: var(--bg); font-weight: 700; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">M</div>
    <h1>Under maintenance</h1>
    <p>We're moving Mahokshahvata to new infrastructure. Your account and portfolios are safe. This page refreshes itself; please check back in a few minutes.</p>
  </div>
</body>
</html>
