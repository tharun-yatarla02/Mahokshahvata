# 2 to 4 replicas on CPU. The ceiling is low on purpose: every replica keeps a
# connection to the small Cloud SQL instance (db-f1-micro) and runs its own
# market-data thread, and 4 fit on the cluster's 2-3 e2-medium nodes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }   # of the 250m request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # default is 5 min; shorter so a demo sees it come back down
